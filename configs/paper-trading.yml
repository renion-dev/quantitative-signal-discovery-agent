# Paper-trading limits for the dashboard (dashboard/app.py).
# The file is optional: when it is missing, the defaults below are used.
#
# Maximum number of simultaneously open positions.
max_open_positions: 3

# Starting capital of the paper account, in USDT. The percentage limit is
# relative to the free balance:
#   free_balance = starting_balance + realized_pnl - open_notional
# where realized_pnl is the sum of closed trades and open_notional is the
# sum of |qty * entry| over the currently open positions.
starting_balance: 10000

# Maximum notional for a single position. Both may be set; the stricter
# (lower) limit applies. Leave null to disable that limit.
#   max_position_size_pct:    percent of the free balance (e.g. 25)
#   max_position_size_amount: fixed nominal amount in USDT (e.g. 1000)
max_position_size_pct: null
max_position_size_amount: null
