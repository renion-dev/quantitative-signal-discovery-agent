# Signal Discovery Workflow (no-telemetry): generate -> code -> evaluate -> feedback loop.
# Variant of config-optimization.yml with the Phoenix tracing exporter stripped, intended
# for cloud / Brev runs where there is no separate `phoenix serve` process to push traces to.

llms:
  signal_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.8
    max_tokens: 4000
    chat_template_kwargs:
      enable_thinking: false

  code_generator:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.0
    max_tokens: 3000
    chat_template_kwargs:
      enable_thinking: false

  optimization_advisor:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1/"
    temperature: 0.5
    max_tokens: 2000
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor
  ic_threshold: 0.02
  p_value_threshold: 0.05
  max_iterations: 3
  num_signals: 2
  forward_periods: 5
  save_results: true
  # --- Optional workflow features (defaults preserve legacy behaviour) ---
  parallel_generation: false      # generate hypotheses concurrently instead of one-by-one
  max_concurrency: 4              # max simultaneous LLM calls when parallel_generation is on
  genetic_crossover: false        # breed the two best signals into a new candidate
  genetic_parents: 2              # how many top-|IC| parents feed the crossover prompt
  skeptic_review: false           # run a pre-backtest skeptic review of each candidate
  skeptic_llm: null               # optional LLM block for the review; null = static checks only
  oos_validation: false           # in-sample/out-of-sample check to detect overfitting
  oos_train_ratio: 0.7            # share of history used for the in-sample split
  oos_reject_overfit: false       # refuse to accept a signal flagged as overfit
  save_evolution: true            # persist run_id/lineage/request in saved result files
