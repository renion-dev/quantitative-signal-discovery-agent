# Binance futures signal discovery using local Ollama (OpenAI-compatible endpoint)
llms:
  signal_generator:
    _type: openai
    model_name: qwen2.5:3b
    base_url: "http://localhost:11434/v1/"
    api_key: "ollama"
    temperature: 0.8
    max_tokens: 4000

  code_generator:
    _type: openai
    model_name: qwen2.5:3b
    base_url: "http://localhost:11434/v1/"
    api_key: "ollama"
    temperature: 0.0
    max_tokens: 3000

  optimization_advisor:
    _type: openai
    model_name: qwen2.5:3b
    base_url: "http://localhost:11434/v1/"
    api_key: "ollama"
    temperature: 0.5
    max_tokens: 2000

workflow:
  _type: signal_optimizer
  signal_generator_llm: signal_generator
  code_generator_llm: code_generator
  optimization_advisor_llm: optimization_advisor
  ic_threshold: 0.02
  p_value_threshold: 0.05
  max_iterations: 2
  num_signals: 2
  forward_periods: 5
  save_results: true
